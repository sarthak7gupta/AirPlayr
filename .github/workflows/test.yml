name: Automated Tests (macOS)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-macos:
    name: Test macOS
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run macOS XCTest Suite
        run: |
          xcodebuild test \
            -scheme AirPlayr \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            -quiet
